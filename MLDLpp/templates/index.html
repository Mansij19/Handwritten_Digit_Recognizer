<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Handwritten digit recognition using deep learning. Upload or capture a digit image and get instant predictions.">
    <title>Digit Recognizer — AI Handwriting Detection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>✦ Digit Recognizer</h1>
        <p>Upload or capture a handwritten digit — AI will identify it instantly.</p>
    </header>

    <main class="container">

        <!-- ── Input Card ──────────────────────────────────────── -->
        <section class="card">
            <div class="card-title">Input</div>

            <div class="input-options">
                <button class="btn" id="uploadBtn" type="button">
                    <span class="btn-icon">📁</span> Upload Image
                </button>
                <button class="btn" id="cameraBtn" type="button">
                    <span class="btn-icon">📷</span> Use Camera
                </button>
                <button class="btn" id="drawBtn" type="button">
                    <span class="btn-icon">✏️</span> Draw Digit
                </button>
            </div>

            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg,image/bmp,image/webp">

            <!-- Drawing Canvas Section -->
            <div class="draw-section" id="drawSection">
                <div class="canvas-container">
                    <canvas id="mainCanvas" width="280" height="280"></canvas>
                </div>
                <div class="canvas-controls">
                    <button class="btn" id="clearCanvasBtn" type="button">
                        <span class="btn-icon">🧹</span> Clear
                    </button>
                    <button class="btn btn-primary" id="predictCanvasBtn" type="button">
                        <span class="btn-icon">🔍</span> Predict Drawing
                    </button>
                </div>
            </div>

            <!-- Image Preview -->
            <div class="preview-area" id="previewArea">
                <div class="preview-wrapper">
                    <img id="previewImage" src="" alt="Preview of uploaded digit">
                    <button class="clear-btn" id="clearBtn" title="Remove image">✕</button>
                </div>
            </div>

            <!-- Camera View -->
            <div class="camera-view" id="cameraView">
                <video id="cameraFeed" autoplay playsinline></video>
                <div class="camera-controls">
                    <button class="btn" id="captureBtn" type="button">
                        <span class="btn-icon">⏺</span> Capture
                    </button>
                    <button class="btn" id="closeCameraBtn" type="button">
                        <span class="btn-icon">✕</span> Close
                    </button>
                </div>
            </div>
        </section>

        <!-- ── Predict Button ──────────────────────────────────── -->
        <div class="predict-section" id="predictSection">
            <button class="btn btn-primary" id="predictBtn" type="button" style="width:100%;">
                🔍 Predict Digit
            </button>
        </div>

        <!-- ── Loading Spinner ─────────────────────────────────── -->
        <div class="spinner" id="spinner">
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
            <div class="spinner-dot"></div>
        </div>

        <!-- ── Result Card ─────────────────────────────────────── -->
        <section class="card result-area" id="resultArea">
            <div class="card-title">Result</div>
            <div id="resultContent"></div>
        </section>

    </main>

    <footer class="footer">Powered by TensorFlow &amp; Flask</footer>

    <!-- ── Hidden canvas for camera capture ─── -->
    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script src="/static/script.js"></script>
</body>
</html>
